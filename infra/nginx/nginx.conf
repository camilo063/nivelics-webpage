worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Gzip compression
    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;
    gzip_vary on;

    # Upstream
    upstream nextjs {
        server app:3000;
    }

    server {
        listen 80;
        server_name nivelics.com www.nivelics.com localhost;

        # Main proxy
        location / {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Cache Next.js static assets — 1 year immutable
        location /_next/static/ {
            proxy_pass http://nextjs;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Cache fonts — 1 year immutable
        location /fonts/ {
            proxy_pass http://nextjs;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Cache static public files
        location ~* \.(ico|svg|png|jpg|jpeg|webp|avif|woff2|woff|ttf)$ {
            proxy_pass http://nextjs;
            add_header Cache-Control "public, max-age=2592000";
        }

        # AI indexability files
        location = /robots.txt {
            proxy_pass http://nextjs;
            add_header Cache-Control "public, max-age=86400";
        }

        location = /llms.txt {
            proxy_pass http://nextjs;
            add_header Cache-Control "public, max-age=86400";
            default_type text/markdown;
        }

        location = /llms-full.txt {
            proxy_pass http://nextjs;
            add_header Cache-Control "public, max-age=86400";
            default_type text/markdown;
        }
    }
}
