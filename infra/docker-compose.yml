services:
  app:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    ports:
      - "3002:3000"
    env_file: ../.env.local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nivelics-net

  postgres:
    image: postgres:16-alpine
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: nivelics_db
      POSTGRES_USER: nivelics
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nivelics -d nivelics_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nivelics-net

  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nivelics-net

  nginx:
    image: nginx:alpine
    ports:
      - "8082:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - nivelics-net

networks:
  nivelics-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
