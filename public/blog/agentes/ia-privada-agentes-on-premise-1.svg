<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="t d" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">
<title id="t">Enrutamiento por clasificación de datos</title>
<desc id="d">La solicitud del agente (prompt más contexto) pasa por un clasificador de datos basado en reglas y un detector de datos personales. Según el nivel de sensibilidad, va a la API pública con acuerdo de no entrenamiento (público o interno no sensible), a la nube en tu cuenta vía red privada con Bedrock o Azure OpenAI (confidencial) o a un modelo abierto on-premise con vLLM (restringido o datos sensibles). Ante la duda, se usa la ruta más restrictiva. Las tres rutas terminan en un registro de auditoría con ruta, modelo y clasificación.</desc>
