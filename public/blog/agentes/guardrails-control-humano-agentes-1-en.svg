<rect x="206" y="42" width="468" height="288" rx="14" fill="#28171c" stroke="#f87171" stroke-opacity=".45" stroke-width="1.5"/><rect x="686" y="42" width="468" height="288" rx="14" fill="#2a2619" stroke="#fbbf24" stroke-opacity=".45" stroke-width="1.5"/><rect x="206" y="342" width="468" height="288" rx="14" fill="#0b2833" stroke="#22d3ee" stroke-opacity=".45" stroke-width="1.5"/><rect x="686" y="342" width="468" height="288" rx="14" fill="#10271f" stroke="#4ade80" stroke-opacity=".45" stroke-width="1.5"/><rect x="234" y="60" width="36" height="4" rx="2" fill="#f87171"/><text x="234" y="95" font-size="24" font-weight="700" fill="#e6edf3" text-anchor="start"><tspan x="234" dy="0">Suggest or execute with</tspan><tspan x="234" dy="31">approval</tspan></text><text x="234" y="159" font-size="20" fill="#b4bcc8" text-anchor="start"><tspan x="234" dy="0">E.g.: payments, master data,</tspan><tspan x="234" dy="26">customer communications</tspan></text><rect x="714" y="60" width="36" height="4" rx="2" fill="#fbbf24"/><text x="714" y="95" font-size="24" font-weight="700" fill="#e6edf3" text-anchor="start"><tspan x="714" dy="0">Execute with approval →</tspan><tspan x="714" dy="31">execute and notify</tspan></text><text x="714" y="159" font-size="20" fill="#b4bcc8" text-anchor="start"><tspan x="714" dy="0">E.g.: configuration change with</tspan><tspan x="714" dy="26">rollback</tspan></text><rect x="234" y="499" width="36" height="4" rx="2" fill="#22d3ee"/><text x="234" y="534" font-size="24" font-weight="700" fill="#e6edf3" text-anchor="start"><tspan x="234" dy="0">Execute with light approval</tspan><tspan x="234" dy="31">(batched)</tspan></text><text x="234" y="598" font-size="20" fill="#b4bcc8" text-anchor="start"><tspan x="234" dy="0">E.g.: internal ticket closure</tspan></text><rect x="714" y="530" width="36" height="4" rx="2" fill="#4ade80"/><text x="714" y="565" font-size="24" font-weight="700" fill="#e6edf3" text-anchor="start"><tspan x="714" dy="0">Autonomous with logging</tspan></text><text x="714" y="598" font-size="20" fill="#b4bcc8" text-anchor="start"><tspan x="714" dy="0">E.g.: tag, classify, query</tspan></text><line x1="680" y1="36" x2="680" y2="636" stroke="#30363d" stroke-width="2"/><line x1="200" y1="336" x2="1160" y2="336" stroke="#30363d" stroke-width="2"/><path d="M570 266 L790 406" fill="none" stroke="#a78bfa" stroke-width="2.5" stroke-opacity="0.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-violet)"/><rect x="597.9" y="321.2" width="164.2" height="29.7" rx="6" fill="#0d1117"/><text x="680" y="342" font-size="19" font-weight="700" fill="#a78bfa" text-anchor="middle"><tspan x="680" dy="0">more autonomy</tspan></text><text x="70" y="336" font-size="22" font-weight="700" fill="#e6edf3" text-anchor="middle" transform="rotate(-90 70 336)">Impact</text><path d="M110 616 V56" fill="none" stroke="#8b949e" stroke-width="2" stroke-opacity="1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-text3)"/><text x="180" y="193" font-size="20" fill="#b4bcc8" text-anchor="end"><tspan x="180" dy="0">High</tspan></text><text x="180" y="493" font-size="20" fill="#b4bcc8" text-anchor="end"><tspan x="180" dy="0">Low</tspan></text><text x="440" y="672" font-size="20" fill="#b4bcc8" text-anchor="middle"><tspan x="440" dy="0">Hard to reverse</tspan></text><text x="920" y="672" font-size="20" fill="#b4bcc8" text-anchor="middle"><tspan x="920" dy="0">Easy to reverse</tspan></text><path d="M220 694 H1140" fill="none" stroke="#8b949e" stroke-width="2" stroke-opacity="1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-text3)"/><rect x="586.2" y="677.7" width="187.6" height="32.7" rx="6" fill="#0d1117"/><text x="680" y="701" font-size="22" font-weight="700" fill="#e6edf3" text-anchor="middle"><tspan x="680" dy="0">Reversibility</tspan></text>
