<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 736" width="1200" height="736" role="img" aria-labelledby="t d" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">
<title id="t">Reversibility and impact matrix</title>
<desc id="d">2x2 matrix that assigns an agent autonomy level by impact (low or high) and reversibility (hard or easy to reverse). High impact and hard to reverse: suggest or execute with approval, for example payments, master data or customer communications. High impact and easy to reverse: move from execute with approval to execute and notify, for example a configuration change with rollback. Low impact and hard to reverse: execute with light approval in batches, for example closing an internal ticket. Low impact and easy to reverse: autonomous with logging, for example tag, classify or query. Autonomy grows toward the bottom right.</desc>
<defs><marker id="m-text" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1 L11,6 L1,11 L3.5,6 z" fill="#e6edf3"/></marker><marker id="m-text-s" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M11,1 L1,6 L11,11 L8.5,6 z" fill="#e6edf3"/></marker><marker id="m-text2" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1 L11,6 L1,11 L3.5,6 z" fill="#b4bcc8"/></marker><marker id="m-text2-s" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M11,1 L1,6 L11,11 L8.5,6 z" fill="#b4bcc8"/></marker><marker id="m-text3" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1 L11,6 L1,11 L3.5,6 z" fill="#8b949e"/></marker><marker id="m-text3-s" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M11,1 L1,6 L11,11 L8.5,6 z" fill="#8b949e"/></marker><marker id="m-line" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1 L11,6 L1,11 L3.5,6 z" fill="#8b949e"/></marker><marker id="m-line-s" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M11,1 L1,6 L11,11 L8.5,6 z" fill="#8b949e"/></marker><marker id="m-border" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1 L11,6 L1,11 L3.5,6 z" fill="#30363d"/></marker><marker id="m-border-s" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M11,1 L1,6 L11,11 L8.5,6 z" fill="#30363d"/></marker><marker id="m-surface" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1 L11,6 L1,11 L3.5,6 z" fill="#161b22"/></marker><marker id="m-surface-s" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M11,1 L1,6 L11,11 L8.5,6 z" fill="#161b22"/></marker><marker id="m-violet" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1 L11,6 L1,11 L3.5,6 z" fill="#a78bfa"/></marker><marker id="m-violet-s" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M11,1 L1,6 L11,11 L8.5,6 z" fill="#a78bfa"/></marker><marker id="m-cyan" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1 L11,6 L1,11 L3.5,6 z" fill="#22d3ee"/></marker><marker id="m-cyan-s" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M11,1 L1,6 L11,11 L8.5,6 z" fill="#22d3ee"/></marker><marker id="m-green" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1 L11,6 L1,11 L3.5,6 z" fill="#4ade80"/></marker><marker id="m-green-s" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M11,1 L1,6 L11,11 L8.5,6 z" fill="#4ade80"/></marker><marker id="m-amber" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1 L11,6 L1,11 L3.5,6 z" fill="#fbbf24"/></marker><marker id="m-amber-s" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M11,1 L1,6 L11,11 L8.5,6 z" fill="#fbbf24"/></marker><marker id="m-red" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1 L11,6 L1,11 L3.5,6 z" fill="#f87171"/></marker><marker id="m-red-s" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M11,1 L1,6 L11,11 L8.5,6 z" fill="#f87171"/></marker></defs>
