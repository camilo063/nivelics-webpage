<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="t d" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">
<title id="t">Las siete capas del harness alrededor del modelo</title>
<desc id="d">El modelo de lenguaje está en el centro, rodeado por siete capas: herramientas orquestadas, verificación independiente, contexto y memoria, guardrails, observabilidad, enrutamiento de modelos y feedback continuo. Los usuarios y eventos entran por el anillo; los sistemas de la organización (ERP, BD, APIs) solo se conectan a la capa de herramientas orquestadas. El modelo no toca sistemas directamente.</desc>
