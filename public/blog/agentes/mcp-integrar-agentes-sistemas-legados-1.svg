<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 785" width="1200" height="785" role="img" aria-labelledby="t d" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">
<title id="t">Arquitectura de un agente con MCP y sistemas legados</title>
<desc id="d">El agente (host más modelo) habla con un cliente MCP. Entre el cliente y los servidores hay una capa de permisos con OAuth, scopes y aprobación humana que todas las conexiones atraviesan. El servidor MCP del ERP llama a la API del ERP, el servidor MCP de base de datos accede en solo lectura a una réplica, y el servidor MCP del sistema legado usa un adaptador (archivos, cola o RPA) para llegar a un sistema sin API. El cliente y los tres servidores envían registros y trazas con OpenTelemetry a un registro de auditoría. El modelo nunca se conecta directo a los sistemas.</desc>
