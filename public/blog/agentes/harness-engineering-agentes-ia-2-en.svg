<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-labelledby="t d" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">
<title id="t">A request moving through the harness</title>
<desc id="d">Left-to-right flow: input with input guardrails, routing, model that proposes an action, tool orchestrator that validates permissions, independent verifier and output. Only the orchestrator connects to ERP, DB and APIs, using a least-privilege credential. If the action is above a threshold, it goes through human approval before the output. Every stage sends traces to observability (traces, metrics, drift), which loops back to the start as feedback for evals.</desc>
