<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t d" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">
<title id="t">Pipeline de evals en integración continua</title>
<desc id="d">Cada cambio propuesto (prompt, herramientas, modelo o versión) corre la suite de regresión del conjunto dorado. Los calificadores (deterministas, reglas y LLM-juez con rúbrica) deciden si se cumple el umbral: si sí, pasa a despliegue gradual; si no, se bloquea con un informe de trazas fallidas y vuelve al cambio propuesto. Los incidentes de producción alimentan la suite: cada falla se vuelve un caso.</desc>
