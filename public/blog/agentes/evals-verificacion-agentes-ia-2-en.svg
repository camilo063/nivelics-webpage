ker><marker id="m-surface" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1 L11,6 L1,11 L3.5,6 z" fill="#161b22"/></marker><marker id="m-surface-s" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M11,1 L1,6 L11,11 L8.5,6 z" fill="#161b22"/></marker><marker id="m-violet" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1 L11,6 L1,11 L3.5,6 z" fill="#a78bfa"/></marker><marker id="m-violet-s" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M11,1 L1,6 L11,11 L8.5,6 z" fill="#a78bfa"/></marker><marker id="m-cyan" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1 L11,6 L1,11 L3.5,6 z" fill="#22d3ee"/></marker><marker id="m-cyan-s" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M11,1 L1,6 L11,11 L8.5,6 z" fill="#22d3ee"/></marker><marker id="m-green" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1 L11,6 L1,11 L3.5,6 z" fill="#4ade80"/></marker><marker id="m-green-s" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M11,1 L1,6 L11,11 L8.5,6 z" fill="#4ade80"/></marker><marker id="m-amber" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1 L11,6 L1,11 L3.5,6 z" fill="#fbbf24"/></marker><marker id="m-amber-s" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M11,1 L1,6 L11,11 L8.5,6 z" fill="#fbbf24"/></marker><marker id="m-red" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1 L11,6 L1,11 L3.5,6 z" fill="#f87171"/></marker><marker id="m-red-s" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M11,1 L1,6 L11,11 L8.5,6 z" fill="#f87171"/></marker></defs>
