34" rx="17" fill="#0d1117" stroke="#a78bfa" stroke-opacity=".6" stroke-width="1.2"/><text x="759" y="138" font-size="18" fill="#e6edf3" text-anchor="middle"><tspan x="759" dy="0">business rules</tspan></text><rect x="646" y="158" width="226" height="57" rx="17" fill="#0d1117" stroke="#a78bfa" stroke-opacity=".6" stroke-width="1.2"/><text x="759" y="180" font-size="18" fill="#e6edf3" text-anchor="middle"><tspan x="759" dy="0">validation against</tspan><tspan x="759" dy="23">source system</tspan></text><rect x="646" y="223" width="226" height="57" rx="17" fill="#0d1117" stroke="#a78bfa" stroke-opacity=".6" stroke-width="1.2"/><text x="759" y="245" font-size="18" fill="#e6edf3" text-anchor="middle"><tspan x="759" dy="0">LLM judge with</tspan><tspan x="759" dy="23">rubric</tspan></text><rect x="994" y="40" width="190" height="80" rx="12" fill="#10271f" stroke="#4ade80" stroke-opacity="0.75" stroke-width="1.5"/><text x="1089" y="86" font-size="20" font-weight="700" fill="#e6edf3" text-anchor="middle"><tspan x="1089" dy="0">Execute tool</tspan></text><path d="M886 80 H991" fill="none" stroke="#4ade80" stroke-width="2" stroke-opacity="1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-green)"/><text x="939" y="66" font-size="18" font-weight="700" fill="#4ade80" text-anchor="middle"><tspan x="939" dy="0">Approved</tspan></text><rect x="994" y="200" width="190" height="80" rx="12" fill="#161b22" stroke="#30363d" stroke-opacity="1" stroke-width="1.5"/><text x="1089" y="246" font-size="20" font-weight="700" fill="#e6edf3" text-anchor="middle"><tspan x="1089" dy="0">Audit log</tspan></text><path d="M1089 122 V197" fill="none" stroke="#8b949e" stroke-width="2" stroke-opacity="1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-line)"/><path d="M759 296 V346" fill="none" stroke="#fbbf24" stroke-width="2" stroke-opacity="1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-amber)"/><text x="772" y="328" font-size="18" font-weight=