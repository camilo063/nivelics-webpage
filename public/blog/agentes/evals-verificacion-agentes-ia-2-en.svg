<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 575" width="1200" height="575" role="img" aria-labelledby="t d" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">
<title id="t">Maker-verifier loop</title>
<desc id="d">A request reaches the executor agent (maker), which produces a proposed action, for example issuing a credit note. An independent verifier checks it with business rules, validation against the source system and an LLM judge with a rubric. If approved, the tool is executed and the action lands in the audit log. If rejected and attempts remain with low risk, it goes back to the agent with the rejection reason; otherwise it is escalated to a human, which is also logged.</desc>
