<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 736" width="1200" height="736" role="img" aria-labelledby="t d" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">
<title id="t">Matriz de reversibilidad e impacto</title>
<desc id="d">Matriz 2x2 que asigna un nivel de autonomía del agente según el impacto (bajo o alto) y la reversibilidad (difícil o fácil de revertir). Alto impacto y difícil de revertir: sugerir o ejecutar con aprobación, por ejemplo pagos, datos maestros o comunicación a clientes. Alto impacto y fácil de revertir: pasar de ejecutar con aprobación a ejecutar y notificar, por ejemplo un cambio de configuración con rollback. Bajo impacto y difícil de revertir: ejecutar con aprobación ligera en lote, por ejemplo el cierre de un ticket interno. Bajo impacto y fácil de revertir: autónomo con registro, por ejemplo etiquetar, clasificar o consultar. La autonomía crece hacia abajo a la derecha.</desc>
