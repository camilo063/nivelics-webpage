<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t d" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">
<title id="t">Observability loop for an agent in production</title>
<desc id="d">The agent in production (model call, execute_tool) sends traces and metrics via OpenTelemetry GenAI to an observability platform that groups traces per task and measures tokens, cost and latency. The platform raises alerts for behavioral drift and for cost or abnormal consumption, which reach a governance dashboard aligned with NIST AI RMF. From there an improvement loop (evals, new version, gradual rollout) goes back to the agent.</desc>
