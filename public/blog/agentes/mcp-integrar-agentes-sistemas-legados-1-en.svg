<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 785" width="1200" height="785" role="img" aria-labelledby="t d" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">
<title id="t">Agent architecture with MCP and legacy systems</title>
<desc id="d">The agent (host plus model) talks to an MCP client. Between the client and the servers sits a permissions layer with OAuth, scopes and human approval that every connection crosses. The ERP MCP server calls the ERP API, the database MCP server reads a replica in read-only mode, and the legacy system MCP server uses an adapter (files, queue or RPA) to reach a system without an API. The client and the three servers send logs and traces via OpenTelemetry to an audit log. The model never connects directly to the systems.</desc>
