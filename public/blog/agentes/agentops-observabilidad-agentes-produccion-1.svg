<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t d" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">
<title id="t">Ciclo de observabilidad de un agente en producción</title>
<desc id="d">El agente en producción (llamada al modelo, execute_tool) emite trazas y métricas con OpenTelemetry GenAI hacia una plataforma de observabilidad que agrupa trazas por tarea y mide tokens, costo y latencia. La plataforma dispara alertas de drift de comportamiento y de costo o consumo anómalo, que llegan a un tablero de gobierno alineado con NIST AI RMF. Desde ahí, un ciclo de mejora (evals, nueva versión, despliegue gradual) vuelve al agente.</desc>
